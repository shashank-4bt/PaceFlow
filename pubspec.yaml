name: paceflow
description: PaceFlow — premium walking tracker. Every Step Has a Story.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

  # Auth
  google_sign_in: ^6.3.0

  # Maps & Location
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.0
  permission_handler: ^12.0.0+1

  # Background
  flutter_foreground_task: ^9.1.0

  # Local DB & storage
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Sensors & connectivity
  pedometer: ^4.1.1
  connectivity_plus: ^6.1.4

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  fl_chart: ^0.71.0
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

  # Sharing & media
  share_plus: ^10.1.4
  screenshot: ^3.0.0

  # Notifications
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1
  async: ^2.13.0
  meta: ^1.16.0
  logging: ^1.3.0
  rxdart: ^0.28.0
  crypto: ^3.0.6
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  drift_dev: ^2.26.0
  mockito: ^5.4.5
  fake_async: ^1.3.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/map_styles/
    - assets/icons/
    - assets/legal/
